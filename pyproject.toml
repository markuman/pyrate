[project]
name = "pyrate"
version = "2.4.0"
description = "minimalistische python-coding-harness mit tui"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.0,<9",  # tui depends on api details (Markdown.get_stream only from 5.0); tested with 8.x
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pyrate = "pyrate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
